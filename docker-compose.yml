services:
  postgres:
    image: postgres:16-alpine
    container_name: dev-trend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devtrend
      POSTGRES_PASSWORD: devtrend
      POSTGRES_DB: devtrend
    volumes:
      - devtrend_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "devtrend"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: ghcr.io/l-desantis/dev-trend:${IMAGE_TAG:-latest}
    container_name: dev-trend-migrate
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://devtrend:devtrend@postgres:5432/devtrend
    command: ["uv", "run", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    image: ghcr.io/l-desantis/dev-trend:${IMAGE_TAG:-latest}
    container_name: dev-trend-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://devtrend:devtrend@postgres:5432/devtrend
    volumes:
      - ./data:/app/data:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2048M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  devtrend_pgdata:
    name: devtrend_pgdata
