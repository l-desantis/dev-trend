name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress CI runs for the same ref when a new push arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (pytest, unit only)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: devtrend
          POSTGRES_PASSWORD: devtrend
          POSTGRES_DB: devtrend_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devtrend"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.27"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync dev deps
        run: uv sync --frozen --extra dev
      - name: pytest
        env:
          DATABASE_URL: postgresql+asyncpg://devtrend:devtrend@localhost:5432/devtrend_test
          LLM_PROVIDER: mock
          EMBEDDING_PROVIDER: mock
        run: uv run pytest -m "not integration" -q
