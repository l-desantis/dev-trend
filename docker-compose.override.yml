services:
  app:
    build: .
    image: dev-trend:dev
    volumes:
      - ./app:/app/app:ro
      - ./data:/app/data:ro
    environment:
      DATABASE_URL: postgresql+asyncpg://devtrend:devtrend@postgres:5432/devtrend
      LOG_LEVEL: DEBUG

  migrate:
    build: .
    image: dev-trend:dev

  postgres:
    environment:
      POSTGRES_USER: devtrend
      POSTGRES_PASSWORD: devtrend
      POSTGRES_DB: devtrend
